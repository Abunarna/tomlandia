name: Gate 7 deterministic world

on:
  push:
    branches:
      - "codex/gate-7-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-world:
    name: World model, reachability and inherited contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:gate7
      - run: bun run build

  versioned-world-database:
    name: Zero-to-head staged UUID world database
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Verify deterministic world artifacts and migration
        run: node scripts/gate7/check.mjs
      - name: Start isolated local stack
        run: supabase start
      - name: Reapply every migration from zero
        run: supabase db reset --local
      - name: Generate Supabase TypeScript contract
        run: |
          supabase gen types typescript --local > gate7-generated-types.ts
          sed -i '${/^$/d;}' gate7-generated-types.ts
      - name: Upload generated type evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate7-generated-supabase-types
          path: gate7-generated-types.ts
          if-no-files-found: error
      - name: Verify inherited Gate 1 foundation
        run: supabase test db supabase/tests/gate1_foundation.sql
      - name: Verify inherited known-defect contracts
        run: supabase test db supabase/tests/gate1_known_defects.sql
      - name: Verify inherited Gate 2 authority
        run: supabase test db supabase/tests/gate2_authority.sql
      - name: Verify inherited canonical schema guards
        run: supabase test db supabase/tests/gate4_content_contract.sql
      - name: Verify inherited staged server contracts
        run: supabase test db supabase/tests/gate6_inactive_server_content.sql
      - name: Verify Gate 7 deterministic UUID world
        run: supabase test db supabase/tests/gate7_versioned_world.sql
      - name: Reject checked-in Supabase type drift
        run: diff -u src/integrations/supabase/types.ts gate7-generated-types.ts
      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup

  audit-missing-canonical-node:
    name: Identify canonical node generator drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Compare locked authoring source with regenerated node spawns
        run: |
          cp content/v2/manifest.authoring.json /tmp/manifest-before.json
          node scripts/gate5/snapshot-live.mjs
          node --no-warnings --experimental-strip-types --loader ./scripts/gate5/ts-loader.mjs scripts/gate5/snapshot-live-spawns.mjs
          node --no-warnings --experimental-strip-types --loader ./scripts/gate5/ts-loader.mjs scripts/gate5/build-new-spawns.mjs
          node --no-warnings --experimental-strip-types --loader ./scripts/gate5/ts-loader.mjs scripts/gate5/build-manifest.mjs
          node -e "const fs=require('fs'); const before=JSON.parse(fs.readFileSync('/tmp/manifest-before.json','utf8')).runtime.node_spawns; const after=JSON.parse(fs.readFileSync('content/v2/manifest.authoring.json','utf8')).runtime.node_spawns; const key=x=>x.kind+':'+x.ordinal; const b=new Map(before.map(x=>[key(x),x])); const a=new Map(after.map(x=>[key(x),x])); console.log('MISSING_FROM_GENERATOR='+JSON.stringify([...b].filter(([k])=>!a.has(k)).map(([,v])=>v))); console.log('UNEXPECTED_FROM_GENERATOR='+JSON.stringify([...a].filter(([k])=>!b.has(k)).map(([,v])=>v)));"

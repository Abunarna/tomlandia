name: Gate 6 inactive server content

on:
  push:
    branches:
      - "codex/gate-6-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-contracts:
    name: Deterministic server and inherited contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:gate6
      - run: bun run build

  inactive-database:
    name: Zero-to-head inactive v2 database
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Verify generated Gate 6 migration
        run: node scripts/gate6/build-migration.mjs --check
      - name: Start isolated local stack
        run: supabase start
      - name: Reapply every migration from zero
        run: supabase db reset --local
      - name: Generate Supabase TypeScript contract
        run: supabase gen types typescript --local > .gate6-generated-types.ts
      - name: Upload generated type evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate6-generated-supabase-types
          path: .gate6-generated-types.ts
          if-no-files-found: error
      - name: Verify inherited Gate 1 foundation
        run: supabase test db supabase/tests/gate1_foundation.sql
      - name: Verify inherited known-defect contracts
        run: supabase test db supabase/tests/gate1_known_defects.sql
      - name: Verify inherited Gate 2 authority
        run: supabase test db supabase/tests/gate2_authority.sql
      - name: Verify inherited canonical schema guards
        run: supabase test db supabase/tests/gate4_content_contract.sql
      - name: Verify Gate 6 v1 stability and staged-v2 isolation
        run: supabase test db supabase/tests/gate6_inactive_server_content.sql
      - name: Reject checked-in Supabase type drift
        run: diff -u src/integrations/supabase/types.ts .gate6-generated-types.ts
      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup

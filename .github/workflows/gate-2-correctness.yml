name: Gate 2 correctness and authority

on:
  push:
    branches:
      - "codex/gate-2-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-contracts:
    name: Client contracts and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck

  database-contracts:
    name: Zero-to-head database authority
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Start isolated local stack
        run: supabase start
      - name: Reapply every migration from zero
        run: supabase db reset --local
      - name: Verify migration and routine foundation
        run: supabase test db supabase/tests/gate1_foundation.sql
      - name: Verify corrected live-defect contracts
        run: supabase test db supabase/tests/gate1_known_defects.sql
      - name: Verify Gate 2 authority invariants
        run: supabase test db supabase/tests/gate2_authority.sql
      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup
